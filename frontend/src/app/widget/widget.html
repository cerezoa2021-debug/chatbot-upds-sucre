<div class="widget-panel" [class.is-open]="widgetState.isOpen()">
  <button
    type="button"
    class="widget-panel-close"
    (click)="widgetState.close()"
    aria-label="Cerrar asistente"
  >
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
    </svg>
  </button>
  <app-chat></app-chat>
</div>

<button
  type="button"
  class="widget-fab"
  [class.is-hidden]="widgetState.isOpen()"
  (click)="widgetState.toggle()"
  aria-label="Abrir asistente de inducción UPDS Sucre"
>
  <span class="fab-pulse" aria-hidden="true"></span>
  <img src="logo-upds.png" alt="" class="fab-logo" />
  <span class="fab-status" aria-hidden="true"></span>
</button>
