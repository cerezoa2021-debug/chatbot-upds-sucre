<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatbot Universitario</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .chat-container {
      width: 100%;
      max-width: 520px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 80vh;
    }

    header {
      background: #1e3c72;
      color: #fff;
      padding: 18px 20px;
    }

    header h1 { font-size: 20px; margin-bottom: 4px; }
    header p  { font-size: 13px; opacity: 0.85; }

    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      background: #f4f6fb;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .mensaje {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .mensaje.usuario {
      align-self: flex-end;
      background: #2a5298;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .mensaje.bot {
      align-self: flex-start;
      background: #e9edf5;
      color: #222;
      border-bottom-left-radius: 4px;
    }

    .mensaje.bot .categoria {
      display: block;
      margin-top: 6px;
      font-size: 11px;
      color: #1e3c72;
      font-weight: 600;
    }

    form {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #fff;
      border-top: 1px solid #e2e6ee;
    }

    input {
      flex: 1;
      padding: 11px 14px;
      border: 1px solid #ccd3e0;
      border-radius: 24px;
      font-size: 14px;
      outline: none;
    }

    input:focus { border-color: #2a5298; }

    button {
      padding: 0 20px;
      border: none;
      border-radius: 24px;
      background: #2a5298;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover { background: #1e3c72; }
  </style>
</head>
<body>
  <div class="chat-container">
    <header>
      <h1>🤖 Chatbot Universitario</h1>
      <p>Pregúntame sobre pagos, plataforma, marketing, etc.</p>
    </header>

    <div id="chat" class="chat-box"></div>

    <form id="form">
      <input
        id="input"
        type="text"
        placeholder="Escribe tu pregunta..."
        autocomplete="off"
      />
      <button type="submit">Enviar</button>
    </form>
  </div>

  <script>
    const chat  = document.getElementById('chat');
    const form  = document.getElementById('form');
    const input = document.getElementById('input');

    // Agrega un mensaje a la conversación
    function agregarMensaje(texto, tipo, categoria) {
      const div = document.createElement('div');
      div.className = 'mensaje ' + tipo;

      if (tipo === 'bot' && categoria) {
        div.innerHTML = texto + '<span class="categoria">📂 ' + categoria + '</span>';
      } else {
        div.textContent = texto;
      }

      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    // Quita el último mensaje (usado para borrar el "Escribiendo...")
    function quitarUltimoMensaje() {
      const ultimo = chat.lastElementChild;
      if (ultimo) ultimo.remove();
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const mensaje = input.value.trim();
      if (!mensaje) return;

      agregarMensaje(mensaje, 'usuario');
      input.value = '';
      agregarMensaje('Escribiendo...', 'bot');

      try {
        // Llama al endpoint del bot (POST /chatbot/preguntar)
        const res = await fetch('/chatbot/preguntar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mensaje }),
        });

        const data = await res.json();
        quitarUltimoMensaje(); // borra el "Escribiendo..."

        if (data.respuesta) {
          agregarMensaje(data.respuesta, 'bot', data.categoria);
        } else {
          agregarMensaje('No se recibió una respuesta válida.', 'bot');
        }
      } catch (err) {
        quitarUltimoMensaje();
        agregarMensaje('⚠️ Error al conectar con el servidor.', 'bot');
      }
    });

    // Foco inicial en el input
    input.focus();
  </script>
</body>
</html>
